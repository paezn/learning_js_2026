    <title>If</title>
</head>
<body>
    <script>
        var nota = 3;
        console.log("Resultado del examen:");

        //Si la nota es igual o mayor que 5
        if(nota < 5)
        {
            // nota menor de 5
            resultado = "Suspendido!";
        }
        else
        {
            // nota mayor o igual a 5
            resultado = "Aprobado!";
        }
        console.log("Estoy ", resultado);
    </script>
